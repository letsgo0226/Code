name: Verify Code

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run self-reconstruction
      run: |
        chmod +x Code.sh
        sh Code.sh Code.sh
        echo "Code total TM self-reconstruction verified."
